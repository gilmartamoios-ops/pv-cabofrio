<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Observatório Verde • Partido Verde (PV) Cabo Frio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.25s ease-out; }
    .story-progress-bar { transition: width 0.1s linear; }
    .blogger-content p { margin-bottom: 0.9rem; }
    .blogger-content img { max-width: 100%; height: auto; border-radius: 1rem; margin: 0.75rem 0; }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-emerald-50/70 via-white to-teal-50/60 text-slate-800 min-h-screen flex flex-col">

  <!-- CABEÇALHO PRINCIPAL -->
  <header class="no-print sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-emerald-100 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <button id="logo-master-trigger" type="button" onclick="navigateTo('home')" class="w-10 h-10 rounded-2xl bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold text-sm flex items-center justify-center shadow-sm shrink-0 select-none transition-colors" title="Observatório Verde • Cabo Frio">
          PV
        </button>
        <div class="min-w-0">
          <p class="text-sm sm:text-base font-extrabold text-emerald-950 truncate">Observatório Verde • Cabo Frio</p>
          <p class="text-[11px] text-slate-500 truncate">Mobilização, Transparência e Controle Social</p>
        </div>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <button onclick="abrirModalLoaPublico()" class="inline-flex items-center gap-1.5 text-xs font-extrabold bg-teal-50 hover:bg-teal-100 text-teal-900 px-3 py-2 rounded-xl border border-teal-200 transition-colors" title="Situação oficial da LOA 2027">
          <span>🏛️</span>
          <span>LOA 2027</span>
        </button>

        <button onclick="openGlobalSearch()" class="inline-flex items-center gap-1.5 text-xs font-bold bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl border border-slate-200 transition-colors" title="Buscar (Ctrl+K)">
          <span>🔎</span>
          <span class="hidden sm:inline">Buscar</span>
        </button>

        <button onclick="tentarAbrirChat()" class="inline-flex items-center gap-1.5 text-xs font-bold bg-emerald-50 hover:bg-emerald-100 text-emerald-900 px-3 py-2 rounded-xl border border-emerald-200 transition-colors">
          <span>💬</span>
          <span class="hidden sm:inline">Canal</span>
          <span id="chat-lock-badge" class="text-[10px] bg-amber-200 text-amber-950 px-1.5 py-0.5 rounded-full font-extrabold">🔒</span>
        </button>

        <div id="master-menu-container" style="display: none;" class="relative">
          <button onclick="toggleMasterDropdown()" class="inline-flex items-center gap-1 text-xs font-extrabold bg-amber-400 hover:bg-amber-500 text-slate-950 px-3 py-2 rounded-xl shadow-sm transition-colors">
            <span>⚙️</span>
            <span class="hidden md:inline">Gestor</span>
          </button>
          <div id="master-dropdown" class="hidden absolute right-0 mt-2 w-60 bg-white rounded-2xl shadow-xl border border-slate-200 p-2 z-50 space-y-1 text-xs">
            <button onclick="abrirModalCadastro()" class="w-full text-left px-3 py-2 rounded-xl hover:bg-emerald-50 font-bold text-slate-800">📋 Base de Membros & Filiados</button>
            <button onclick="abrirModalPainelCoord()" class="w-full text-left px-3 py-2 rounded-xl hover:bg-emerald-50 font-bold text-slate-800">📨 Mensagens da Coordenação</button>
            <button onclick="abrirModalAdicionarZapFiliado()" class="w-full text-left px-3 py-2 rounded-xl hover:bg-emerald-50 font-bold text-slate-800">📱 Atualizar WhatsApp Filiado</button>
            <button onclick="exportarFiliadosTSECSV()" class="w-full text-left px-3 py-2 rounded-xl hover:bg-emerald-50 font-bold text-slate-800">📥 Exportar CSV FILIA/TSE</button>
            <button onclick="copiarSantinhoLiberacao()" class="w-full text-left px-3 py-2 rounded-xl hover:bg-emerald-50 font-bold text-slate-800">🔑 Copiar Mensagem de Convite</button>
            <div class="border-t border-slate-100 my-1"></div>
            <button onclick="simularVisitanteNovo()" class="w-full text-left px-3 py-2 rounded-xl hover:bg-rose-50 font-bold text-rose-700">👁️ Simular Visitante Novo</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- MODAL PÚBLICO: AVISO DE TRAMITAÇÃO DA LOA 2027 -->
  <div id="modal-loa-publico" class="no-print hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl border border-teal-200 p-6 sm:p-7 space-y-5 animate-fade-in">
      <div class="flex items-start justify-between gap-3 border-b border-slate-100 pb-4">
        <div>
          <span class="inline-flex items-center gap-1.5 text-[10px] font-extrabold uppercase tracking-wider bg-amber-100 text-amber-950 px-3 py-1 rounded-full">
            ⏳ Em Tramitação na Câmara
          </span>
          <h3 class="text-xl font-extrabold text-slate-900 mt-2">LOA 2027 • Orçamento Municipal de Cabo Frio</h3>
        </div>
        <button onclick="fecharModalLoaPublico()" class="text-slate-400 hover:text-slate-700 font-bold text-lg px-2">✕</button>
      </div>

      <div class="bg-teal-50/80 border border-teal-200 rounded-2xl p-4 sm:p-5 space-y-2.5 text-sm text-slate-700">
        <p class="font-extrabold text-teal-950">A Lei Orçamentária Anual (LOA 2027) ainda está em tramitação.</p>
        <p class="leading-relaxed text-xs sm:text-sm">
          O projeto do
